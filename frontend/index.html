<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="theme-color" content="#1C2A2B" />

  <!-- SEO Primary Meta Tags -->
  <title>BuyBright — Smart Shopping, Brilliant Savings | Multi-Seller Marketplace</title>
  <meta name="description"
    content="Shop authentic electronics, fashion, home essentials, and lifestyle products from verified marketplace sellers across India." />
  <meta name="keywords"
    content="dental supply india, dentalproducts, superendo rotary files, composite restorative, 3m ESPE composite, dental equipment, dental instruments, b2b dental procurement" />
  <meta name="author" content="BuyBright" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://buybright.com/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://buybright.com/" />
  <meta property="og:title" content="BuyBright " />
  <meta property="og:description"
    content="India's modern multi-seller marketplace. 100% genuine products with fast doorstep delivery." />
  <meta property="og:image" content="/images/banner.webp" />
  <meta property="og:site_name" content="BuyBright" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="BuyBright — India's Smart Multi-Seller Marketplace" />
  <meta name="twitter:description"
    content="Authentic electronics, fashion, home essentials, and lifestyle products with verified sellers across India." />
  <meta name="twitter:image" content="/images/logo.svg" />

  <!-- Favicon & Touch Icons -->
  <link rel="icon" type="image/svg+xml" href="/images/logo-icon.svg" />
  <link rel="apple-touch-icon" href="/images/logo-icon.svg" />

  <!-- Performance & Font Optimization -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Schema.org JSON-LD Structured Data for Rich Search Results -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "BuyBright",
        "description": "India's premier multi-seller e-commerce marketplace platform.",
        "url": "https://buybright.com",
        "logo": "https://buybright.com/images/logo.svg",
        "image": "https://buybright.com/images/logo.svg",
        "priceRange": "$$",
        "telephone": "+91-98765-43210",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "IN"
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://buybright.com/?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
</head>

<body>
  <!-- Accessibility Skip Link -->
  <a href="#main-content" class="skip-to-content" style="position: absolute; top: -9999px; left: -9999px;">
    Skip to main content
  </a>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
